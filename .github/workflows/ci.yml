name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Check Clippy
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.99.1 test --locked
      - name: Build
        run: cargo +1.99.1 build --locked --release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t log-forge-ci .
      - name: Check configuration
        run: docker run --rm --network none log-forge-ci config validate --file /app/config/default_config.yaml
      - name: Generate logs
        run: docker run --rm --network none log-forge-ci start --output console --types redis,ssh_auth,kafka_broker --total 6 --seed 42 --no-monitor
      - name: Check original command name
        run: docker run --rm --network none --entrypoint log-generator log-forge-ci --version
